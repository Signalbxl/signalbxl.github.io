:root{--bg:#0b1220;--tx:#f5f5f7;--gr:#b4bac6;--ye:#ffd400;--tr:#7a8aa8;--ln:#33425f;--mi:#2ee59d}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.big{font-size:20px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font:400 1rem/1.45 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,a,input{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
h1:focus{outline:none}
#wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px 12px}
.test{border:2px solid var(--ye);color:var(--ye);font:500 1rem/1.3 "IBM Plex Mono",monospace;padding:6px 10px;margin:8px 0 0}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:3.1rem;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:.25rem;height:1.6rem}
.bars i{display:block;width:.5rem;background:var(--ln)}
.bars i.on{background:var(--ye)}
.aa{min-width:3rem;min-height:3rem;background:transparent;border:2px solid var(--tr);border-radius:0;color:var(--gr);font:500 1rem "IBM Plex Mono",monospace;cursor:pointer;padding:0 .5rem}
.aa[aria-pressed=true]{border-color:var(--ye);color:var(--ye)}
.cnt{margin:2px 0 0;font:500 1rem/1.35 "IBM Plex Mono",monospace;color:var(--gr);min-height:2.7rem}
.cnt span{display:block}
.scr{flex:1;display:flex;flex-direction:column}
.scr.in{animation:in .2s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.mf{min-height:1.5rem;margin:4px 0 0;font:500 1rem/1.5rem "IBM Plex Mono",monospace;color:var(--mi)}
h1{font:700 1.55rem/1.18 "Chakra Petch",sans-serif;margin:2px 0 10px;overflow-wrap:anywhere}
.sub{margin:0 0 10px;color:var(--gr)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:3.2rem;margin:0 0 8px;padding:10px 16px;background:transparent;border:2px solid var(--tr);border-radius:0;text-align:left;font-weight:500;line-height:1.3;cursor:pointer}
@media (hover:hover){.opt:hover{border-color:var(--tx)}}
.opt:active{border-color:var(--ye)}
.opt.sel{border-color:var(--ye)}
.opt.sel::after{content:"";flex:none;width:12px;height:12px;background:var(--ye)}
.opt.flash{background:var(--ye);border-color:var(--ye);color:#0b1220}
.opt.flash::after{background:#0b1220}
.opt.mu::after{content:"";flex:none;width:14px;height:14px;border:2px solid var(--tr)}
.opt.mu.sel::after{border-color:var(--ye);background:var(--ye)}
.navrow{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.back,.skip{display:inline-flex;align-items:center;min-height:3rem;min-width:3rem;background:transparent;border:0;color:var(--gr);font:500 1rem "IBM Plex Mono",monospace;cursor:pointer;padding:0 8px}
.back{padding-left:0;gap:8px}
.skip{text-decoration:underline;padding-right:0;justify-content:flex-end}
.chev{display:inline-block;width:9px;height:9px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:3.3rem;padding:12px 16px;border:2px solid var(--tr);background:transparent;text-align:center;text-decoration:none;font-weight:500;cursor:pointer;border-radius:0;line-height:1.3}
.btn.pri{background:var(--ye);border-color:var(--ye);color:#0b1220}
.btn.pri:active{background:var(--tx);border-color:var(--tx)}
.btn[disabled]{opacity:.45;cursor:default}
.cont{margin:2px 0 4px}
.intro{justify-content:center;text-align:center;align-items:center}
.intro h1{font-size:2rem;margin:12px 0 10px}
.intro p{margin:0 0 8px;color:var(--gr);max-width:34ch}
.intro p.warm{color:var(--tx);margin:6px 0 18px}
.intro .btn{max-width:320px}
.sig{width:5.5rem;height:5.5rem;border:3px solid var(--ye);border-radius:50%;margin:6px 0}
.rev .lead{margin:6px 0 0;color:var(--gr)}
.rev h1{font-size:2rem;color:var(--ye);margin:2px 0 12px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.pill{border:2px solid var(--ln);padding:4px 10px;line-height:1.3}
.info{border-top:2px solid var(--ln);padding-top:12px;margin:0 0 14px}
.fin h1{margin:6px 0 8px}
.fin p{margin:0 0 10px}
.fin .hint{color:var(--gr);margin:8px 0 12px}
.msg{border:2px solid var(--ln);padding:10px 12px;margin:0 0 10px}
.msg .lab{margin:0 0 6px;color:var(--gr)}
.msg pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:500 1rem/1.4 "IBM Plex Mono",monospace;color:var(--tx)}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0;overflow:hidden}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-height:700px){.sig{width:3.5rem;height:3.5rem}}
@media (min-width:700px){#wrap{max-width:560px}}
</style>
</head>
